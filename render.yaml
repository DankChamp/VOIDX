services:
  voidx-backend:
    type: web
    plan: free
    region: oregon
    dockerfilePath: backend/Dockerfile
    # No startCommand: the Dockerfile ENTRYPOINT runs seed -> uvicorn.
    autoDeploy: true
    healthCheck:
      httpPath: /api/health
      initialWaitSeconds: 20
    envVars:
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./voidx.db
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      # Add these THREE as Render Secrets (Settings > Environment > Secrets)
      # so they are never committed to the repo:
      #   SECRET_KEY      (REQUIRED) a long random string for JWT signing
      #   GROQ_API_KEY    (optional) enables the AI PII-message sanitizer
      #   DATABASE_URL    (optional) override; for production use Postgres:
      #                     postgresql+asyncpg://user:pass@host:5432/voidx
