services:
  - type: web
    name: voidx-backend
    runtime: docker
    plan: free
    region: oregon
    # Builds the root Dockerfile (default dockerfilePath: ./Dockerfile).
    # ENTRYPOINT seeds the leader account (idempotent), then starts uvicorn.
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./voidx.db
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      # Add these as Render Secrets (Settings > Environment > Secrets),
      # never committed to the repo:
      #   SECRET_KEY    (REQUIRED) long random string for JWT signing
      #   GROQ_API_KEY  (optional) enables the AI PII sanitizer
      #   DATABASE_URL  (optional) override for production (Postgres):
      #                   postgresql+asyncpg://user:pass@host:5432/voidx
